# Deploys the app to Databricks (environment "dev" = the current workspace).
#
#   push to main            -> tests -> deploy
#   Actions -> Run workflow -> tests -> deploy (manual)
#
# Credentials come from the GitHub environment "dev" (Settings -> Environments -> dev):
#   variable DATABRICKS_HOST          workspace URL
#   variable DATABRICKS_CLIENT_ID     Application ID of the service principal sp-rag-deployer
#   secret   DATABRICKS_CLIENT_SECRET OAuth secret of that service principal
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # only used if you later switch to secret-less OIDC sign-in

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    uses: ./.github/workflows/_deploy.yml
    with:
      target: dev
    secrets: inherit
