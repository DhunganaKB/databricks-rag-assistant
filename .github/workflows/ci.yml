# Continuous integration: runs on every push and pull request.
# Lint + format check + unit/API tests + "requirements.txt matches uv.lock".
# No Databricks credentials are needed (all external services are faked in tests).
# The deployment workflow (Databricks Apps via Asset Bundles) is added in the next step.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Format check
        run: uv run ruff format --check src tests scripts

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80

      - name: requirements.txt is in sync with uv.lock
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt -o /tmp/requirements.txt
          diff -u <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt)
