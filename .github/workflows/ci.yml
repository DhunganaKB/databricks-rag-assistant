# Continuous integration: lint + format check + unit/API tests + "requirements.txt matches uv.lock".
# No Databricks credentials are needed (all external services are faked in tests).
#
# Runs on pull requests and on pushes to branches other than main. Pushes to main run it as
# the first job of the deploy workflow (workflow_call), so nothing deploys without passing it.
name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Format check
        run: uv run ruff format --check src tests scripts

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80

      - name: requirements.txt is in sync with uv.lock
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt -o /tmp/requirements.txt
          diff -u <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt)
