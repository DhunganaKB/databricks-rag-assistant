[project]
name = "rag-app"
version = "0.1.0"
description = "RAG chat application on Azure Databricks with conversation history and bounding-box citations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "databricks-sdk>=0.60",
    "openai>=1.40",
    "httpx>=0.27",
    "pillow>=10.4",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs a live Databricks workspace (skipped unless RAG_INTEGRATION=1)"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
# S101: asserts in tests. S608: SQL is built only from validated identifiers (config.uc_name);
# values always go through bound parameters. E501: line length is owned by `ruff format`
# (prompt prose and SQL strings stay readable instead of being split mid-sentence).
ignore = ["S101", "S608", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["rag_app"]
known-local-folder = ["conftest"]

[tool.coverage.run]
source = ["src/rag_app"]
# Needs a real Postgres/Lakebase server: covered by integration tests in the deployment
# pipeline, not by unit tests.
omit = ["src/rag_app/store/postgres.py"]
