# Databricks Asset Bundle: deploys the RAG app as a Databricks App.
#
# One environment: target `dev` = your current Azure Databricks workspace.
# It is deployed by GitHub Actions (.github/workflows/deploy.yml), signed in as the
# deployment service principal. See docs/DEPLOYMENT.md.
#
# No secrets in this file: the pipeline's credentials come from the GitHub environment `dev`.
bundle:
  name: rag-assistant

include:
  - resources/*.yml

variables:
  deployer_sp:
    description: >-
      Application ID of the deployment service principal. Set automatically by the
      pipeline (BUNDLE_VAR_deployer_sp = DATABRICKS_CLIENT_ID).
    default: ""
  app_name:
    description: Databricks App name (lowercase, hyphens, max 30 characters).
    default: rag-assistant-dev
  app_users_group:
    description: Workspace group allowed to use the app.
    default: users
  gold_schema:
    description: catalog.schema with chunks_index, citation_locations and rag_documents (from the ETL project).
    default: steampunk.dev_kbdhunga_rag_gold
  page_image_volume:
    description: catalog.schema.volume with the rendered page images (from the ETL project).
    default: steampunk.dev_kbdhunga_rag_silver.page_images
  llm_endpoint:
    default: databricks-claude-sonnet-5-5
  helper_llm_endpoint:
    default: databricks-claude-haiku-5-5
  warehouse_id:
    description: SQL warehouse for the citation viewer (looked up by name).
    lookup:
      warehouse: Serverless Starter Warehouse
  lakebase_instance:
    description: Lakebase instance for conversation history and memory.
    default: rag-memory-dev
  lakebase_database:
    description: Postgres database used by the deployed app (created once, see docs/DEPLOYMENT.md step 5).
    default: rag_app

targets:
  dev:
    default: true
    mode: production  # deployed by the pipeline identity, no name prefixes
    workspace:
      host: https://adb-7405616448132971.11.azuredatabricks.net
      # The deployment lives in the service principal's private folder, so only the
      # pipeline can change it (never /Workspace/Shared, which every user could edit).
      root_path: /Workspace/Users/${var.deployer_sp}/.bundle/${bundle.name}/${bundle.target}
